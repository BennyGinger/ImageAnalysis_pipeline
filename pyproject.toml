[project]
name = "imageanalysis-pipeline"
version = "1.1.1"
description = "Analysis pipelines for fluorescent microscopic images, mainly time sequences, that is capable of pre-process, segment, track and get data of single cells."
readme = "README.md"
authors = [
    {name = "Benoit Thomas Roux", email = "benoit.roux@gmail.com"},
    {name = "Fabian Gregory Dehne", email = "fabiang.dehne@gmail.com"},
    {name = "Raphael David FEURSTEIN", email = "raphael.feurstein@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "cellpose[gui]<4.0",
    "ipython>=9.2.0",
    "ipywidgets>=8.1.7",
    "markupsafe<3.0",
    "matplotlib>=3.10.1",
    "nd2>=0.10.3",
    "opencv-python>=4.11.0.86",
    "pandas[parquet]>=2.2.3",
    "pyqt6>=6.9.0",
    "pystackreg>=0.2.8",
    "pytorch-lightning>=2.5.1.post0",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.2",
    "seaborn>=0.13.2",
    "smo>=2.0.2",
    "tifffile>=2025.3.30",
    "torch-geometric>=2.6.1",
    # only install CUDA scatter/sparse wheels on Linux or Win32
    "torch_sparse==0.6.18+pt26cu124; sys_platform=='linux' or sys_platform=='win32'",
    "torch_scatter==2.1.2+pt26cu124; sys_platform=='linux' or sys_platform=='win32'",
    # always install core torch from pytorch-cu124 index
    "torch==2.6.0+cu124",
    "torchvision==0.21.0+cu124",
    "torchaudio==2.6.0+cu124",
]

[project.scripts]
imageanalysis-pipeline = "pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imageanalysis"]

[tool.uv.sources]
torch       = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]
torchaudio  = [{ index = "pytorch-cu124" }]

# PyG extras: exact URLs from https://data.pyg.org/whl/torch-2.6.0%2Bcu124.html
torch_sparse = [
  { url    = "https://data.pyg.org/whl/torch-2.6.0%2Bcu124/torch_sparse-0.6.18+pt26cu124-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux'" },
  { url    = "https://data.pyg.org/whl/torch-2.6.0%2Bcu124/torch_sparse-0.6.18+pt26cu124-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32'" },
]

torch_scatter = [
  { url    = "https://data.pyg.org/whl/torch-2.6.0%2Bcu124/torch_scatter-2.1.2+pt26cu124-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux'" },
  { url    = "https://data.pyg.org/whl/torch-2.6.0%2Bcu124/torch_scatter-2.1.2+pt26cu124-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name     = "pytorch-cu124"
url      = "https://download.pytorch.org/whl/cu124/"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

